<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Generatore Nomi Fantasy</title>
  <style>
    :root{
      --bg1:#071014;
      --bg2:#102538;
      --bg3:#271033;
      --text:#f8efe0;
      --muted:#c9b89b;
      --gold:#d9a441;
      --gold2:#f4d27a;
      --card:rgba(15,20,30,.86);
      --border:rgba(244,210,122,.28);
      --aqua:#58c7d8;
      --violet:#a978ff;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      min-height:100vh;
      font-family:Georgia,"Times New Roman",serif;
      color:var(--text);
      background:
        radial-gradient(circle at 20% 20%, rgba(88,199,216,.18), transparent 25%),
        radial-gradient(circle at 80% 16%, rgba(169,120,255,.18), transparent 28%),
        linear-gradient(135deg,var(--bg1),var(--bg2),var(--bg3));
      padding:34px 16px;
    }
    .wrap{width:min(980px,100%);margin:0 auto}
    nav{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
    a{color:var(--gold2);text-decoration:none}
    .nav-link{
      padding:10px 14px;
      border-radius:999px;
      border:1px solid var(--border);
      background:rgba(0,0,0,.25);
    }
    .hero,.panel{
      border:1px solid var(--border);
      background:var(--card);
      border-radius:28px;
      box-shadow:0 24px 70px rgba(0,0,0,.4);
    }
    .hero{padding:30px;margin-bottom:18px}
    .eyebrow{color:var(--gold2);letter-spacing:2px;text-transform:uppercase;font-size:12px;font-weight:bold;margin-bottom:8px}
    h1{font-size:clamp(38px,7vw,72px);line-height:.92;margin-bottom:12px}
    p{color:var(--muted);line-height:1.6;font-size:17px}
    .panel{padding:24px}
    .controls{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:14px;
      margin-bottom:18px;
    }
    label{display:block;color:var(--muted);margin-bottom:7px;font-size:14px}
    select,input{
      width:100%;
      padding:12px 13px;
      border-radius:14px;
      border:1px solid var(--border);
      background:rgba(0,0,0,.28);
      color:var(--text);
      outline:none;
      font-size:16px;
      font-family:Arial,sans-serif;
    }
    option{background:#101826;color:white}
    .btn-row{display:flex;gap:12px;flex-wrap:wrap;margin:18px 0}
    button{
      border:0;
      border-radius:999px;
      padding:12px 16px;
      cursor:pointer;
      color:#140e08;
      background:linear-gradient(135deg,var(--gold2),var(--gold));
      font-weight:bold;
      transition:transform .18s ease, filter .18s ease, box-shadow .18s ease;
    }
    button:hover{transform:translateY(-3px);filter:brightness(1.08);box-shadow:0 12px 24px rgba(217,164,65,.2)}
    .ghost{background:transparent;color:var(--gold2);border:1px solid var(--border)}
    .results{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:12px;
      margin-top:18px;
    }
    .name-card{
      padding:18px;
      border-radius:20px;
      border:1px solid var(--border);
      background:rgba(0,0,0,.25);
      position:relative;
      overflow:hidden;
    }
    .name-card:before{
      content:"";
      position:absolute;
      width:130px;
      height:130px;
      border-radius:50%;
      top:-70px;
      right:-60px;
      background:rgba(88,199,216,.12);
    }
    .name-card strong{
      position:relative;
      display:block;
      font-size:25px;
      color:var(--gold2);
      margin-bottom:8px;
    }
    .name-card span{
      position:relative;
      color:var(--muted);
      line-height:1.45;
    }
    .tiny{
      font-size:13px;
      color:rgba(248,239,224,.62);
      margin-top:14px;
    }
    @media(max-width:760px){
      .controls,.results{grid-template-columns:1fr}
      .hero,.panel{padding:22px}
    }
  </style>
</head>
<body>
  <main class="wrap">
    <nav>
      <a class="nav-link" href="index.html">← Archivio</a>
      <a class="nav-link" href="scheda.html">📜 Crea scheda</a>
    </nav>

    <section class="hero">
      <div class="eyebrow">Onomante da taverna</div>
      <h1>Generatore Nomi</h1>
      <p>Scegli razza/specie, tono e stile. Poi genera una rosa di nomi fantasy pronti da copiare o usare nella scheda.</p>
    </section>

    <section class="panel">
      <div class="controls">
        <div>
          <label for="species">Razza / Specie</label>
          <select id="species">
            <option>Umano</option>
            <option>Elfo</option>
            <option>Mezzelfo</option>
            <option>Nano</option>
            <option>Halfling</option>
            <option>Gnomo</option>
            <option>Mezzorco</option>
            <option>Tiefling</option>
            <option>Dragonide</option>
          </select>
        </div>

        <div>
          <label for="tone">Tono</label>
          <select id="tone">
            <option value="nobile">Nobile</option>
            <option value="oscuro">Oscuro</option>
            <option value="eroico">Eroico</option>
            <option value="buffo">Buffo</option>
            <option value="mistico">Mistico</option>
          </select>
        </div>

        <div>
          <label for="style">Stile</label>
          <select id="style">
            <option value="classico">Classico fantasy</option>
            <option value="italico">Medievale italico</option>
            <option value="nordico">Nordico</option>
            <option value="esotico">Esotico</option>
          </select>
        </div>
      </div>

      <div class="btn-row">
        <button type="button" onclick="generateNames()">Genera nomi</button>
        <button class="ghost" type="button" onclick="copyFirst()">Copia il primo</button>
        <button class="ghost" type="button" onclick="sendToSheet()">Usa primo nella scheda</button>
      </div>

      <div class="results" id="results"></div>
      <p class="tiny">Tip: se arrivi qui dalla scheda, puoi copiare un nome o usare “Usa primo nella scheda”.</p>
    </section>
  </main>

  <script>
    const data = {
      "Umano": {
        first:["Aldren","Ser Caligo","Mira","Roderic","Eliana","Terenzio","Livia","Cassian","Bruna","Valerio"],
        last:["Valcorvo","Delle Brume","Ferroscuro","Altafonte","Di Vetro","Spinarossa","Neravalle"]
      },
      "Elfo": {
        first:["Aelar","Sylvaris","Elowen","Thalanil","Maeriel","Faelar","Luneth","Ithildra","Vaerion","Sirael"],
        last:["Foglia d'Argento","Cantastelle","Rugiada Lunare","Vento Quieto","Lama d'Aurora"]
      },
      "Mezzelfo": {
        first:["Kaelen","Arieth","Lorian","Selene","Nerian","Mavren","Elyra","Corian","Talia","Vaelis"],
        last:["Dueponti","Mezzaluna","Ramo Errante","Sogliachiara","Cuorediviso"]
      },
      "Nano": {
        first:["Borin","Dagna","Thrain","Korga","Durik","Hilda","Brom","Grenda","Torag","Marda"],
        last:["Martelfiero","Barbadirame","Pietrasalda","Scudonero","Forgiafondale"]
      },
      "Halfling": {
        first:["Pippo","Milo","Nella","Tilda","Berto","Lina","Odo","Mira","Nando","Pervinca"],
        last:["Sottocolle","Buonbarile","Piedilesti","Melasoffice","Tortafrolla"]
      },
      "Gnomo": {
        first:["Fizzik","Nim","Boddynock","Lilli","Zook","Trilli","Wizzle","Pim","Dabble","Nixie"],
        last:["Scintillavite","Girabrugola","Mezzalente","Friggimolla","Ticchettini"]
      },
      "Mezzorco": {
        first:["Ghar","Brakka","Morg","Ugra","Dorn","Ketha","Ruk","Varka","Thok","Graza"],
        last:["Spezzazanne","Pugnoduro","Ferromorso","Teschiorotto","Gridasorda"]
      },
      "Tiefling": {
        first:["Malakar","Nyx","Zariel","Vesper","Akta","Damakos","Lilith","Sable","Nerezza","Kaelith"],
        last:["Senzaluce","Corno Cremisi","Peccato Dolce","Fiammafredda","Ombra del Patto"]
      },
      "Dragonide": {
        first:["Arjhan","Balasar","Kava","Nadarr","Rhogar","Akra","Daar","Kriv","Tarhun","Vyra"],
        last:["Fiammascaglia","Artigliodorato","Soffioantico","Crestarossa","Sanguewyrm"]
      }
    };

    const toneBits = {
      nobile:["il Degno","della Corona Spezzata","Mano Dorata","Custode del Giuramento"],
      oscuro:["il Tetro","dei Sepolcri","Sussurro Nero","Portatore di Presagi"],
      eroico:["Cuore Saldo","Lama Lucente","Scudo dell'Alba","il Temerario"],
      buffo:["Mangiatorte","Senza Mappa","Birra Breve","il Distratto"],
      mistico:["Vela Astrale","Occhio del Sogno","Eco Arcana","delle Rune"]
    };

    const styleBits = {
      classico:["Th","ae","or","wyn","dar","iel","mor"],
      italico:["io","ano","ella","oro","vanni","enza","aldo"],
      nordico:["grim","bjorn","ulf","hild","runa","skor","var"],
      esotico:["za","esh","qir","anu","sek","ra","ith"]
    };

    const results = document.getElementById("results");

    function pick(arr){
      return arr[Math.floor(Math.random() * arr.length)];
    }

    function maybeFlavor(name, tone){
      return Math.random() > 0.45 ? `${name} ${pick(toneBits[tone])}` : name;
    }

    function generateOne(){
      const species = document.getElementById("species").value;
      const tone = document.getElementById("tone").value;
      const style = document.getElementById("style").value;

      const base = data[species];
      const first = pick(base.first);
      const last = pick(base.last);
      const extra = pick(styleBits[style]);

      let name = Math.random() > 0.5 ? `${first} ${last}` : `${first}${extra} ${last}`;
      name = maybeFlavor(name, tone);

      return {
        name,
        desc: `${species} · tono ${tone} · stile ${document.getElementById("style").selectedOptions[0].textContent}`
      };
    }

    function generateNames(){
      results.innerHTML = "";
      const names = Array.from({length:6}, generateOne);

      names.forEach((item, index) => {
        const div = document.createElement("div");
        div.className = "name-card";
        div.innerHTML = `<strong>${item.name}</strong><span>${item.desc}</span>`;
        div.addEventListener("click", () => navigator.clipboard?.writeText(item.name));
        results.appendChild(div);
      });
    }

    function getFirstName(){
      const first = results.querySelector(".name-card strong");
      if (!first) {
        generateNames();
        return results.querySelector(".name-card strong").textContent;
      }
      return first.textContent;
    }

    function copyFirst(){
      const name = getFirstName();
      navigator.clipboard?.writeText(name);
      alert(`Copiato: ${name}`);
    }

    function sendToSheet(){
      const name = encodeURIComponent(getFirstName());
      window.location.href = `scheda.html?name=${name}`;
    }

    const params = new URLSearchParams(window.location.search);
    const incomingSpecies = params.get("species");
    if (incomingSpecies && data[incomingSpecies]) {
      document.getElementById("species").value = incomingSpecies;
    }

    generateNames();
  </script>
</body>
</html>
